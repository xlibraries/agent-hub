name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --all-packages --dev

      - name: Ruff
        run: uv run ruff check packages/slm/src packages/slm/tests benchmarks

      - name: Pytest
        run: uv run pytest -q

      - name: Latency benchmark (mock)
        run: uv run python benchmarks/run_latency.py --mock --runs 3
