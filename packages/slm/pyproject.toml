[project]
name = "slm"
version = "0.1.0"
description = "Agent Hub core (slm): models, CLI, protocol, repo context, LangGraph planner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "langgraph>=0.2",
    "opentelemetry-api>=1.29",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "typer>=0.15",
]

[project.scripts]
slm = "slm.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slm"]
